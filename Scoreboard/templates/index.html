<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
    <!-- Link to the Bootstrap CSS (using the CDN) -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1 class="text-center">Scoreboard applicatie!</h1>
    <p class="text-center">Zie hier de camera's van de robotautos!</p>
    <a id="trigger-action-button" class="btn btn-primary">Start geselecteerde auto's</a>
    
    <!-- Display data passed from Flask -->
    <div class="container">
        <!-- Create a Bootstrap row for the items -->
        <div class="row" id="data-container">
            <!-- The dynamic containers will be inserted here -->
        </div>
    </div>

    <!-- Embed the data in a script tag to make it available to script.js -->
    <script>
        // Pass the data from Flask to JavaScript
        var data = {{ data | tojson }};
    </script>

    <!-- Link to the external JavaScript file -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <!-- Link to the Bootstrap JS and dependencies (optional) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
